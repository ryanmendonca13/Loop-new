# Supabase CLI config (local development). Separate projects are used for staging and production;
# never point local tooling at production.
project_id = "loop-athlete-local"

[api]
port = 54321
schemas = ["public"]
max_rows = 200

[db]
port = 54322
major_version = 16

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.mfa]
max_enrolled_factors = 5
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30

[storage]
file_size_limit = "10MiB"

[functions.ai-draft]
verify_jwt = true
[functions.billing-session]
verify_jwt = true
[functions.stripe-webhook]
verify_jwt = false
[functions.notify-dispatch]
verify_jwt = false
[functions.expire-requests]
verify_jwt = false
[functions.data-rights]
verify_jwt = false
